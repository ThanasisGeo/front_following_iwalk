# CMU-Mocap locomotion subset with the UPTor paper's protocol (Table II): 10 Hz, 0.5 s history (5 frames) -> 1 s
# prediction (10 frames), scored on the root. Same model as darko_PathPoseCV.yml. Plan:
# ../UPTor/docs/training_plan.md, section 10
dataset: CMU
model_name: PathUNetPose
model_specs:
  n_feats_unet: 16          # (the UNet is built, then dropped: map_input none)
  n_feats_unet_mlp: 1024    # read by UNet.__init__ but unused (kept so the released UNet code runs)
  mlp_width: 512            # only keeps the (then deleted) bottleneck MLP small while the model is built
  mlp_dropout: 0.2          # dropout inside the correction head
  output: cv_residual       # path = constant velocity + learned correction
  aux_decoder: false        # no Branch B
  map_input: none           # no UNet, no maps
  cv_vel_frames: 1          # velocity from the last frame step (0.1 s): best of 1-4 on train+val (H36M 199 vs 212 mm,
                            # CMU 131 vs 153 mm ADE with 4); the 0.5-s history is short, so recent motion matters most
  cv_head_width: 256        # hidden width of the correction head
  pose_input: learned       # learned pose-history encoder
  n_feats_pose_path: 128

dataset_specs:
  data_file: ../data/CMU/   # the trial .npy files (UPTor/cmu_mocap/data), relative to datasets/
  hz: 10                    # 30 Hz resampled to 10 Hz (every 3rd frame; all 3 offsets for training)
  n_hist: 5                 # 0.5 s
  n_pred: 10                # 1.0 s
  n_joints: 18              # COCO-17 order + root
  root_idx: 17
  left_hip_idx: 11
  right_hip_idx: 12
  heading_frames: 2         # actor frame +x = root motion over the last 2 frames (0.2 s), as the authors' loader
  heading_min_move: 0.05    # ... unless the root moved < 5 cm (standing): then +x = the way the hips face
  max_dist_from_human: 4    # read by the model code; the maps themselves cover map_extent
  map_extent: 2.5
  map_size: 40              # hard-coded 5x5 bottleneck in the UNet (built, then dropped): must stay 40
  use_map: true             # the loader still returns the (all-unknown) occupancy map; the model ignores it
  use_traj_map: false       # no past-path maps (the model doesn't use them)
  # the paper's test trials are not published: random by-trial folds as for DARKO. 14 folds = ~7% of the
  # frames per fold, the paper's share (12,854 of 178,531). Other folds: --set dataset_specs.test_fold=k
  split_seed: 0
  n_folds: 14
  test_fold: 0
  val_frac: 0.1
  test_offsets: all         # the authors' loader scores every start frame at 30 Hz (all 3 offsets, stride 1)
  test_stride: 1

loss:
  distance: euclidean       # mean distance (what ADE/FDE measure) instead of squared error
  use_traj: true
  use_final_pos: true
  use_traj_map: false
  use_collision: false
  use_obstacle: false       # no obstacles
  weight_traj: 1
  weight_final_pos: 1

turns:                      # Real-IM thresholds (3-s horizon) scaled by 1/3 for the 1-s horizon
  dt: 0.1                   # s per frame (10 Hz)
  vel_frames: 1             # same as constant velocity (also the reported CV baseline)
  turn_lat: 0.25
  turn_heading: 30.0
  straight_lat_max: 0.17
  hist_curv_new: 15.0
  onset_lat: 0.083
  lat_bins: [0.0, 0.083, 0.25, 0.5]

lr: 0.0001
lr_step_size: 20            # LR x0.1 at epochs 20 and 40 (train 50 epochs: ~150K windows per epoch)
lr_gamma: 0.1
weight_decay: 0.0001        # AdamW
augment:
  mirror: 0.5               # left/right mirror augmentation
save_freq: 25
