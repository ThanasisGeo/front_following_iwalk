# M1-small-CV: pose history + map. Path = constant velocity + learned correction. Compare with real_PathUNetSmallCV.
dataset: Real_IM
model_name: PathUNetPose
model_specs:
  n_feats_unet: 16          # half-width convolutions (32 = released size)
  n_feats_unet_mlp: 1024    # read by UNet.__init__ but unused (kept so the released UNet code runs)
  mlp_width: 512            # bottleneck MLP width (released: 4096); ~72 M -> ~4 M parameters
  mlp_dropout: 0.2          # dropout before fc2 and fc3
  output: cv_residual       # path = constant velocity + learned correction (heat-maps only as auxiliary loss)
  cv_vel_frames: 4          # velocity from the last 4 past frames (0.8 s) of each window
  cv_head_width: 256        # hidden width of the correction head
  pose_input: learned       # learned pose-history encoder (M1)
  n_feats_pose_path: 128    # size of the learned pose feature fed into the UNet bottleneck

dataset_specs:
  n_hist: 15
  n_pred: 15
  n_joints: 18
  data_file: ../data/Real-IM-Dataset-processed/
  max_dist_from_human: 4
  num_scene_points: 50000
  step: 1

  root_idx: 17
  left_hip_idx: 11
  right_hip_idx: 12

  use_raw_obs: false
  use_env_pcd: false
  use_map: true
  use_traj_map: true
  use_pose_gt: false
  map_size: 40              # hard-coded 5x5 bottleneck in the UNet: must stay 40
  z_min: -1.0
  z_max: 0.5
  z_floor: -0.3

  train: ['kl_f2_seq1_raw', 'kl_f4_seq2_raw', 'me_f2_seq2_raw', 'op_seq3_raw']
  test: ['me_f2_seq1_raw']

loss:                       # path losses only (same weights as the paper's cfg)
  use_traj: true
  use_final_pos: true
  use_traj_map: true
  use_collision: true
  weight_traj: 1
  weight_final_pos: 1
  weight_traj_map: 1.0
  weight_collision: 1.0
  weight_bce: 40.0

turns:                      # turn detection thresholds (utils/turns.py DEFAULT_THRESHOLDS)
  turn_lat: 0.75
  turn_heading: 30.0
  straight_lat_max: 0.5
  hist_curv_new: 15.0
  onset_lat: 0.25

lr: 0.0001                  # from scratch (small models cannot warm start)
lr_step_size: 200           # LR x0.1 at epochs 200 and 400 (train ~400 epochs)
lr_gamma: 0.1
weight_decay: 0.0001        # AdamW weight decay (0 = plain Adam)
save_freq: 100
