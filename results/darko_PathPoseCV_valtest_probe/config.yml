dataset: DARKO
model_name: PathUNetPose
model_specs:
  n_feats_unet: 16
  n_feats_unet_mlp: 1024
  mlp_width: 512
  mlp_dropout: 0.2
  output: cv_residual
  aux_decoder: false
  map_input: none
  cv_vel_frames: 12
  cv_head_width: 256
  pose_input: learned
  n_feats_pose_path: 128
  prior: unicycle
dataset_specs:
  data_file: ../data/DARKO/
  hz: 15
  n_hist: 15
  n_pred: 30
  n_joints: 18
  root_idx: 17
  root_joint: pelvis
  left_hip_idx: 11
  right_hip_idx: 12
  heading_frames: 3
  max_dist_from_human: 4
  map_extent: 2.5
  map_size: 40
  use_map: true
  use_traj_map: false
  split_seed: 0
  n_folds: 7
  test_fold: 0
  val_frac: 0.1
loss:
  distance: euclidean
  use_traj: true
  use_final_pos: true
  use_traj_map: false
  use_collision: false
  use_obstacle: false
  weight_traj: 1
  weight_final_pos: 1
turns:
  dt: 0.0667
  vel_frames: 12
  turn_lat: 0.5
  turn_heading: 30.0
  straight_lat_max: 0.33
  hist_curv_new: 15.0
  onset_lat: 0.17
  lat_bins:
  - 0.0
  - 0.17
  - 0.5
  - 1.0
lr: 0.0001
lr_step_size: 60
lr_gamma: 0.1
weight_decay: 0.0001
augment:
  mirror: 0.5
save_freq: 25
