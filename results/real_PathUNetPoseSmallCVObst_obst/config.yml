dataset: Real_IM
model_name: PathUNetPose
model_specs:
  n_feats_unet: 16
  n_feats_unet_mlp: 1024
  mlp_width: 512
  mlp_dropout: 0.2
  output: cv_residual
  aux_decoder: false
  cv_vel_frames: 4
  cv_head_width: 256
  pose_input: learned
  n_feats_pose_path: 128
dataset_specs:
  n_hist: 15
  n_pred: 15
  n_joints: 18
  data_file: ../data/Real-IM-Dataset-processed/
  max_dist_from_human: 4
  map_extent: 2.5
  num_scene_points: 50000
  step: 1
  root_idx: 17
  left_hip_idx: 11
  right_hip_idx: 12
  use_raw_obs: false
  use_env_pcd: false
  use_map: true
  use_traj_map: true
  use_pose_gt: false
  map_size: 40
  z_min: -1.0
  z_max: 0.5
  z_floor: -0.3
  train:
  - kl_f2_seq1_raw
  - kl_f4_seq2_raw
  - me_f2_seq2_raw
  - op_seq3_raw
  test:
  - me_f2_seq1_raw
loss:
  use_traj: true
  use_final_pos: true
  use_traj_map: false
  use_collision: false
  use_obstacle: true
  obstacle_margin: 0.2
  weight_obstacle: 10.0
  weight_traj: 1
  weight_final_pos: 1
turns:
  turn_lat: 0.75
  turn_heading: 30.0
  straight_lat_max: 0.5
  hist_curv_new: 15.0
  onset_lat: 0.25
lr: 0.0001
lr_step_size: 200
lr_gamma: 0.1
weight_decay: 0.0001
augment:
  mirror: 0.5
save_freq: 100
